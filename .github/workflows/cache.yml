name: Cache

on:
  pull_request:
    paths: ["cache/**", ".github/workflows/cache.yml"]
  push:
    branches: [main]
    paths: ["cache/**", ".github/workflows/cache.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cache/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cache/backend/requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: ruff check cache_addon tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cache/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cache/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
