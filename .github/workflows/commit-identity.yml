name: Commit identity

# Fails when a pushed commit (or a PR commit) isn't authored/committed with
# the repo owner's GitHub identity. GitHub credits commits by email, so a
# tool that guesses an identity like <name>@users.noreply.github.com ends up
# crediting a stranger's account - see "Commit identity" in CLAUDE.md.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check author and committer emails
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          allowed_author="75352153+jumpmanactual@users.noreply.github.com"
          # noreply@github.com is GitHub itself committing edits made in the
          # web UI (the author is still you).
          allowed_committers="$allowed_author noreply@github.com"

          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..HEAD"
          elif [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$' \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            # New branch, or a force-push whose old head is gone: check
            # everything not already on the default branch.
            git fetch -q origin "${{ github.event.repository.default_branch }}" || true
            range="origin/${{ github.event.repository.default_branch }}..HEAD"
          fi

          bad=0
          while IFS='|' read -r sha author committer subject; do
            [ -z "$sha" ] && continue
            if [ "$author" != "$allowed_author" ]; then
              echo "::error::$sha has author <$author> (expected <$allowed_author>): $subject"
              bad=1
            fi
            case " $allowed_committers " in
              *" $committer "*) ;;
              *) echo "::error::$sha has committer <$committer>: $subject"; bad=1 ;;
            esac
          done < <(git log --format='%h|%ae|%ce|%s' "$range")

          if [ "$bad" -ne 0 ]; then
            echo "Fix: git config user.email $allowed_author, then amend/rewrite the commits above."
            exit 1
          fi
          echo "All commits in $range use the expected identity."
