name: Gains

on:
  pull_request:
    paths: ["gains/**", ".github/workflows/gains.yml"]
  push:
    branches: [main]
    paths: ["gains/**", ".github/workflows/gains.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gains/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gains/backend/requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: ruff check gains_addon tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gains/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gains/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
