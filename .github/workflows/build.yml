name: Build

# Publishes ghcr.io/jumpman-actual-labs/{arch}-addon-cache:<version> for every
# push to main, tagged with config.yaml's version. Home Assistant only offers
# an update when that version changes, so bump it (and CHANGELOG.md) in the
# same commit as any change meant to ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/cache \
            --addon
