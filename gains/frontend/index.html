<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gains</title>
    <style>
      /* Home Assistant's default accent - the panel used to inherit the
         user's theme accent from HA's frontend, which an ingress iframe
         doesn't. Everything else comes from theme.ts. */
      :root {
        --primary-color: #03a9f4;
        --text-primary-color: #fff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f5f6f8;
        color: #566373;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0a1117;
          color: #a0afb9;
        }
      }
      body > .loading {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="loading">Loading Gains…</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
