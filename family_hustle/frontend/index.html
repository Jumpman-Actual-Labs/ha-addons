<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Hustle</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f7f9;
        color: #7b8796;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: light;
      }
      /* family-app sets data-theme; the loading screen guesses from the OS. */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]),
        html:not([data-theme="light"]) body {
          background: #12151a;
          color: #9aa4b2;
          color-scheme: dark;
        }
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #12151a;
        color: #9aa4b2;
        color-scheme: dark;
      }
      body > .loading {
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="loading">Loading Family Hustle…</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
